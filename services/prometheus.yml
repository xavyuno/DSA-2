global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Every Ballerina service exposes metrics on 9797 inside its own container.
  # Delete the services your group has not built/started yet (they would show as DOWN).
  - job_name: order-service
    static_configs:
      - targets: ["order-service:9797"]
  - job_name: customer-service
    static_configs:
      - targets: ["customer-service:9797"]
  - job_name: restaurant-service
    static_configs:
      - targets: ["restaurant-service:9797"]
  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:9797"]
  - job_name: delivery-service
    static_configs:
      - targets: ["delivery-service:9797"]
  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:9797"]
  - job_name: admin-service
    static_configs:
      - targets: ["admin-service:9797"]
