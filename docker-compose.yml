services:
  kafka:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  customer-service:
    build:
      context: ./services/customer-service
    ports:
      - "8085:8085"
    environment:
      BAL_CONFIG_VAR_SERVICEPORT: 8085
      BAL_CONFIG_VAR_MONGOURL: mongodb://mongodb:27017
      BAL_CONFIG_VAR_MONGODATABASE: food_delivery
    depends_on:
      - kafka
      - mongodb

  payment-service:
    build:
      context: ./services/payment-service
    ports:
      - "8082:8082"
    environment:
      BAL_CONFIG_VAR_SERVICEPORT: 8082
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:9092
      BAL_CONFIG_VAR_PAYMENTSCOMPLETEDTOPIC: payments.completed
      BAL_CONFIG_VAR_KAFKACLIENTID: payment-service
    depends_on:
      - kafka
      - mongodb

  admin-service:
    build:
      context: ./services/admin-service
    ports:
      - "8087:8087"
    environment:
      BAL_CONFIG_VAR_ADMINPORT: 8087
      BAL_CONFIG_VAR_KAFKABROKER: kafka:9092
      BAL_CONFIG_VAR_MONGOURI: mongodb://mongodb:27017
      BAL_CONFIG_VAR_KAFKAGROUPID: admin-service-group
      BAL_CONFIG_VAR_ORDERSCREATEDTOPIC: orders.created
    depends_on:
      - kafka
      - mongodb

volumes:
  mongo_data: